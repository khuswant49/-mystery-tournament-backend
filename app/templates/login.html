<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Login — Mystery Tournament</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<main style="max-width:360px; margin-top:120px;">
  <div class="panel">
    <h2>Admin Login</h2>
    <form method="post" action="/admin/login">
      <label for="pin">PIN</label>
      <input type="password" id="pin" name="pin" autofocus required>
      <div style="margin-top:16px;"><button type="submit">Log in</button></div>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </div>
</main>
</body>
</html>
