databases:
  # NOTE: free-tier Postgres is auto-deleted 90 days after creation, and the
  # free web service below sleeps after 15 min idle (30-60s cold start on the
  # next request). Both are fine for testing but MUST be upgraded to a paid
  # plan (e.g. basic-256mb / starter) before the actual event, or a player
  # finishing mid-round could stall waiting for a sleeping instance to wake.
  - name: mystery-tournament-db
    plan: free
    databaseName: mystery_tournament
    user: mystery_tournament

services:
  - type: web
    name: mystery-tournament-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mystery-tournament-db
          property: connectionString
      - key: ADMIN_PIN
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      # Must be set to the EXACT same value as the CAR_ADMIN_KEY constant
      # flashed into all 3 cars' esp32_car_wifi/car*/car*.ino firmware --
      # generateValue would produce a value that doesn't match, breaking
      # /admin/set-password. Falls back to app/config.py's placeholder
      # default if left unset here (see the security-review note that led
      # to this being an env var instead of a code default).
      - key: CAR_ADMIN_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      # Render defaults to the newest available Python (3.14 as of this
      # writing), for which psycopg2-binary has no prebuilt wheel yet --
      # its compiled .so fails to import with an ABI mismatch
      # (undefined symbol: _PyInterpreterState_Get). Pin to a version
      # psycopg2-binary==2.9.9 has known-good wheels for.
      - key: PYTHON_VERSION
        value: "3.12.7"
